const AF_STORY = [
 {badge:'Prologue · Scene 1.1', title:'🌙 A little girl with a big dream', art:'bedroom', track:'scene1-music.mp3',

 {badge:'Act 2 · Scene 2', title:'🚀 The mysterious rocket', art:'bedroom2', video:'scene2-rocket.mp4', track:'scene2-music.mp3',

  quiet:true,   /* this page has no narrator: the characters tell it */

        {s:"Wait... what's that sound?"},

 {badge:'Act 2 · Scene 3', title:'🔥 Three, two, one... Liftoff!', art:'launch', video:'scene3-garden.mp4', track:'scene3-music.mp3',

 {badge:'Prologue · Scene 1.2', title:'✨ The magical journey begins', art:'portal',

 /* ---------------- CHAPTER ONE: SPIRIT ---------------- */
 {badge:'Chapter One · Scene 2.1', title:'🛠️ Two little explorers are born', art:'lab',
  desc:"Long before Shasha arrived on Mars, two extraordinary explorers were born on Earth. Their names were Spirit and Opportunity. They were not ordinary machines. They were designed to become humanity's eyes and hands on another planet.",

 {badge:'Chapter One · Scene 2.1', title:'👯 Why build two?', art:'split',
  desc:"Their mission was to investigate the rocks and soil of Mars, searching for evidence that water had once existed there. But there was a problem. Mars missions were difficult, expensive and risky. After two previous Mars missions had failed, NASA needed to make this mission count. So, instead of sending one rover, NASA built two.",

 {badge:'Chapter One · Scene 2.1', title:'🚀 Launch day', art:'launch',
  desc:"They were given a simple mission: survive for just 90 Martian days. But nobody knew that these two little machines would become some of the greatest explorers in the history of Mars.",

 {badge:'Chapter One · Scene 2.2', title:'🎈 The bouncing landing', art:'landing',

  desc:"Spirit had suffered a serious problem. Its right-front wheel was no longer working properly, and eventually, it stopped functioning altogether. For many explorers, losing a wheel would mean the end of the journey. But NASA's engineers refused to give up."},
 {badge:'Chapter One · Scene 2.3', title:'↩️ Driving backwards', art:'drag',
  desc:"They found a way to keep Spirit moving. Instead of driving forward normally, Spirit had to travel backwards, dragging its broken wheel across the Martian ground.",

 {badge:'Chapter One · Scene 2.4', title:'⚪ A broken wheel uncovers a secret', art:'silica',

  desc:"Scientists discovered that the bright soil contained almost pure silica, a material commonly found in glass. On Earth, deposits of silica like this can form around hot springs and steam vents. That meant ancient Mars may once have had environments where hot water flowed beneath or across its surface."},
 {badge:'Chapter One · Scene 2.4', title:'♨️ A very different Mars', art:'hotspring',
  pre:["So... Mars wasn't always the cold and dry planet we see today?"],
  desc:"Exactly. Spirit's broken wheel had accidentally uncovered evidence of a very different Mars. A Mars that may once have been warmer, wetter and filled with environments shaped by water.",

 {badge:'Chapter One · Scene 2.5', title:'🕳️ Trapped at Troy', art:'troy',
  desc:"After years of exploring, Spirit became trapped in soft sand at a place called Troy. Its wheels could no longer carry it forward. But its mission was not immediately over. NASA decided to turn Spirit into a stationary science station, allowing it to continue collecting valuable information about Mars. Then winter arrived.",

 {badge:'Chapter One · Scene 2.5', title:'❄️ The last winter of Spirit', art:'winter',
  desc:"On March 22, 2010, Spirit sent its last signal home. NASA continued trying to contact it, sending more than 1,300 commands over the following months. But no answer came. The most likely explanation was that the freezing Martian winter had become too much for its heaters to overcome.",
  post:[{s:"Spirit... you worked so hard."},{s:"Even though you couldn't move anymore, you left something important behind."},{n:"Spirit's journey had ended, but its discoveries would continue helping scientists understand the history of Mars."}],
  fact:"NASA officially ended Spirit's mission on May 25, 2011."},

 /* ---------------- CHAPTER TWO: OPPORTUNITY ---------------- */
 {badge:'Chapter Two · Scene 3.1', title:'🌍 Meanwhile, on the other side of Mars', art:'eaglefall',
  desc:"While Spirit was exploring Gusev Crater, its twin, Opportunity, was arriving on the opposite side of Mars. Opportunity had travelled millions of kilometres to reach its new home. And its landing was almost unbelievable."},
 {badge:'Chapter Two · Scene 3.1', title:'⛳ A hole-in-one landing', art:'eagle',

 {badge:'Chapter Two · Scene 3.2', title:'💧 Tiny clues', art:'berrycut',

 {badge:'Chapter Two · Scene 3.3', title:'🛞 A journey longer than anyone imagined', art:'odometer',
  desc:"Opportunity was designed to travel approximately one kilometre during its 90-day mission. But something extraordinary happened. It kept going. And going. And going. One year passed. Then another. Then another. The little rover that was only supposed to work for three months continued exploring Mars for almost 15 years."},
 {badge:'Chapter Two · Scene 3.4', title:'⏳ Trapped in Purgatory', art:'purgatory',

 {badge:'Chapter Two · Scene 3.5', title:'🏅 The marathon on another world', art:'marathon',

 {badge:'Chapter Two · Scene 3.5', title:'📏 Record after record', art:'records',

 {badge:'Chapter Two · Scene 3.6', title:'🧭 Following the traces of ancient water', art:'endeavour',

 {badge:'Chapter Two · Scene 3.6', title:'🏞️ Gentler water', art:'lake',

 {badge:'Chapter Two · Scene 3.7', title:'🌪️ The storm that covered an entire planet', art:'storm',
  desc:"Opportunity had survived for almost 15 years. It had crossed craters, climbed slopes, escaped dangerous sand traps and travelled farther than anyone had expected. But in June 2018, Mars faced something extraordinary. A planet-wide dust storm began spreading across the surface."},

  const fail = () => `<p class="af-note">Couldn't load live photos here. <a href="https://images.nasa.gov/search?q=opportunity%20rover" target="_blank" rel="noopener">Open NASA's image library</a>.</p>`;
